<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How the editor cuts a mesh, step by step</title>
<style>
:root { --bg: #0b1020; --panel: #111830; --panel2: #162042; --line: #26325a; --text: #dbe4ff; --dim: #8e9cc8; --accent: #60a5fa; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
#pills { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
#pills button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); font: 600 12px ui-sans-serif, system-ui; cursor: pointer; }
#pills button.done { color: #c7d2fe; }
#pills button.cur { background: var(--accent); border-color: var(--accent); color: #07101f; }
main { display: grid; grid-template-columns: minmax(380px, 34%) 1fr; min-height: 0; }
#card { overflow-y: auto; padding: 22px 26px 18px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
#meta { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 13px; }
#where { border: 1px solid var(--line); border-radius: 12px; padding: 1px 10px; font-size: 12px; color: #c7d2fe; background: var(--panel2); }
#title { font-size: 23px; line-height: 1.25; margin: 12px 0 10px; display: flex; gap: 14px; align-items: flex-start; }
#title .big { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #07101f; display: grid; place-items: center; font-size: 21px; font-weight: 750; }
#body p, #body li { color: #cdd7f6; }
#body ul, #body ol { padding-left: 20px; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(255,255,255,.07); padding: 0 4px; border-radius: 3px; }
.box { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
.box h3 { margin: 0; padding: 6px 12px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
#math { margin: 0; padding: 10px 12px; font: 13.5px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: #e0e7ff; }
#trick { padding: 4px 12px 8px; font-size: 14px; color: #cdd7f6; }
#trick ul { padding-left: 18px; margin: 6px 0; }
#trick-box { border-color: #3b4f8a; }
#trick-box h3 { color: #93c5fd; }
nav { margin-top: auto; padding-top: 18px; display: flex; gap: 10px; }
nav button { flex: 1; padding: 10px; font: 600 15px ui-sans-serif, system-ui; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
nav button#next { background: var(--accent); border-color: var(--accent); color: #07101f; }
nav button:disabled { opacity: .35; cursor: default; }
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#view canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -130%); font: 12px ui-monospace, Menlo, monospace; white-space: nowrap; padding: 1px 5px; border-radius: 4px; background: rgba(8, 12, 28, .82); color: #fff; border: 1px solid rgba(255,255,255,.15); }
.lbl.kept { color: #86efac; } .lbl.removed { color: #fca5a5; } .lbl.on { color: #fde047; } .lbl.poly { color: #67e8f9; }
#legend, #colorbar-wrap { position: absolute; left: 14px; background: rgba(13, 19, 40, .88); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
#legend { bottom: 14px; }
#colorbar-wrap { top: 14px; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
#colorbar { width: 140px; height: 9px; border-radius: 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
#hint { position: absolute; right: 14px; bottom: 14px; color: var(--dim); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>How the editor cuts a mesh</h1>
  <div id="pills"></div>
</header>
<main>
  <section id="card">
    <div id="meta"><span id="num"></span><span id="where"></span></div>
    <h2 id="title"></h2>
    <div id="body"></div>
    <div class="box" id="math-box"><h3>Maths</h3><pre id="math"></pre></div>
    <div class="box" id="trick-box"><h3>GPU / three.js trick</h3><div id="trick"></div></div>
    <nav><button id="prev">◀ Previous</button><button id="next">Next ▶</button></nav>
  </section>
  <section id="view">
    <div id="labels"></div>
    <div id="colorbar-wrap">result value <span id="colorbar"></span></div>
    <div id="legend"></div>
    <div id="hint">drag to turn · scroll to zoom · ← → to change step</div>
  </section>
</main>
<script>/*__BUNDLE__*/</script>
</body>
</html>
