<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How the editor cuts a mesh, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* DotBlocks design system tokens (app/globals.css) */
:root {
  --neutral-0: #ffffff; --neutral-50: #f6f9f9; --neutral-100: #f1f5f9; --neutral-200: #e2e8f0; --neutral-300: #c7d1d4;
  --neutral-400: #9eadb3; --neutral-500: #6c7b83; --neutral-600: #4a5a63; --neutral-700: #33424a; --neutral-900: #1c242a;
  --primary-50: #fff5e9; --primary-500: #fe5b04; --primary-600: #e14f03;
  --secondary-100: #e6f4f5; --secondary-500: #167c85; --secondary-700: #084f57;
  --background: var(--neutral-50); --foreground: var(--neutral-900); --card: var(--neutral-0);
  --muted: var(--neutral-100); --muted-foreground: var(--neutral-500); --border: var(--neutral-200);
  --primary: var(--primary-500); --secondary: var(--secondary-700); --accent: var(--secondary-100);
  --font-sans: Figtree, ui-sans-serif, system-ui, sans-serif;
  --font-heading: Poppins, ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --radius-sm: .25rem; --radius-md: .5rem; --radius-lg: 1rem; --radius-full: 9999px;
  --shadow-xs: 0 10px 15px 0 rgb(158 173 179 / .07); --shadow-sm: 0 8px 16px 0 rgb(51 66 74 / .07);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground); font: 16px/1.5 var(--font-sans); }
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
header h1 { font: 600 18px/24px var(--font-heading); margin: 0; white-space: nowrap; }
header h1 b { color: var(--primary); font-weight: 700; }
#pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
#pills button { width: 30px; height: 30px; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font: 600 12px var(--font-sans); cursor: pointer; transition: background .15s, color .15s; }
#pills button:hover { border-color: var(--secondary-500); color: var(--secondary-500); }
#pills button.done { background: var(--accent); color: var(--secondary); border-color: var(--accent); }
#pills button.cur { background: var(--primary); border-color: var(--primary); color: var(--neutral-0); }
main { display: grid; grid-template-columns: minmax(380px, 34%) 1fr; min-height: 0; gap: 16px; padding: 16px; }
#card { overflow-y: auto; padding: 24px 26px 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
#meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted-foreground); font-size: 12px; line-height: 16px; font-weight: 500; }
#where { border-radius: var(--radius-full); padding: 2px 10px; background: var(--accent); color: var(--secondary); font-weight: 600; }
#title { font: 600 24px/32px var(--font-heading); margin: 14px 0 12px; display: flex; gap: 14px; align-items: flex-start; }
#title .big { flex: none; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--primary); color: var(--neutral-0); display: grid; place-items: center; font: 700 18px var(--font-heading); }
#body { font-size: 16px; line-height: 24px; color: var(--neutral-700); }
#body b { color: var(--foreground); }
#body ul, #body ol { padding-left: 20px; }
code { font: 13px var(--font-mono); background: var(--muted); padding: 1px 5px; border-radius: var(--radius-sm); color: var(--secondary); }
.box { margin-top: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); overflow: hidden; }
.box h3 { margin: 0; padding: 6px 12px; font: 600 12px/16px var(--font-sans); letter-spacing: .4px; text-transform: uppercase; color: var(--muted-foreground); border-bottom: 1px solid var(--border); background: var(--muted); }
#math { margin: 0; padding: 10px 12px; font: 13.5px/1.6 var(--font-mono); white-space: pre-wrap; color: var(--neutral-900); }
#trick { padding: 4px 12px 8px; font-size: 14px; line-height: 20px; color: var(--neutral-700); }
#trick ul { padding-left: 18px; margin: 6px 0; }
#trick-box { border-color: var(--primary-500); background: var(--primary-50); }
#trick-box h3 { color: var(--primary-600); background: transparent; border-color: rgb(254 91 4 / .25); }
nav { margin-top: auto; padding-top: 20px; display: flex; gap: 10px; }
nav button { flex: 1; height: 40px; font: 600 14px var(--font-sans); border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
nav button:hover:not(:disabled) { background: var(--muted); }
nav button#next { background: var(--primary); border-color: var(--primary); color: var(--neutral-0); }
nav button#next:hover:not(:disabled) { background: var(--primary-600); }
nav button:disabled { opacity: .4; cursor: default; }
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); box-shadow: var(--shadow-sm); }
#view canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -130%); font: 500 12px var(--font-mono); white-space: nowrap; padding: 1px 6px; border-radius: var(--radius-sm); background: var(--card); color: var(--foreground); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
.lbl.kept { color: #067647; } .lbl.removed { color: #dc2626; } .lbl.on { color: #8c6d1f; } .lbl.poly { color: var(--secondary); }
#legend, #colorbar-wrap { position: absolute; left: 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 10px; font-size: 13px; color: var(--neutral-700); box-shadow: var(--shadow-xs); }
#legend { bottom: 14px; }
#colorbar-wrap { top: 14px; display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 12px; }
#colorbar { width: 140px; height: 8px; border-radius: var(--radius-full); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: var(--radius-sm); margin-right: 4px; vertical-align: -1px; }
#hint { position: absolute; right: 14px; top: 14px; color: var(--muted-foreground); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1><b>DotBlocks</b> · How the editor cuts a mesh</h1>
  <div id="pills"></div>
</header>
<main>
  <section id="card">
    <div id="meta"><span id="num"></span><span id="where"></span></div>
    <h2 id="title"></h2>
    <div id="body"></div>
    <div class="box" id="math-box"><h3>Maths</h3><pre id="math"></pre></div>
    <div class="box" id="trick-box"><h3>GPU / three.js trick</h3><div id="trick"></div></div>
    <nav><button id="prev">◀ Previous</button><button id="next">Next ▶</button></nav>
  </section>
  <section id="view">
    <div id="labels"></div>
    <div id="colorbar-wrap">result value <span id="colorbar"></span></div>
    <div id="legend"></div>
    <div id="hint">drag to turn · scroll to zoom · ← → to change step</div>
  </section>
</main>

<li><b>Planes</b>: three.js does it already. The planes go in <code>material.clippingPlanes</code>, no custom code.</li>
<li><b>Boxes and spheres</b>: three.js has no volume clipping. The app injects a few lines into every material's
shader with <code>onBeforeCompile</code>, right after three.js' own clipping code: the vertex shader passes the world
position, the fragment shader loops over the volume matrices and discards.</li>
<li>All materials share <b>one uniform array</b> of matrices. Moving a box rewrites that array: no shader recompiles.</li>
<li>The test uses <b>1 + 0.0001</b> instead of 1, so a box face flush with a mesh face is removed cleanly instead of flickering.</li></ul>`,scene:{model:"block",elements:[We([0,-.25,0],[.1,1,0]),Cs([.5,.45,.35],[.7,.7,.7])],surface:"hollow",normals:!0,camera:[2.4,2.3,2.8],anim:(n,t)=>t.update(1,{center:[.6*Math.sin(n*.7),.45,.35]})}},{title:"Problem: the cut is hollow",where:"Why a cap",body:`<p>The surface is only a skin of triangles; the inside is empty. Once pixels are hidden, you look

<ul><li>all positive: kept whole, no cap;</li><li>all negative: removed whole, no cap;</li>
<li>mixed: the plane crosses it (yellow). Only these make the cap.</li></ul>`,math:`kept corners = count of d &gt; 0.000001
crossed \u21D4 kept corners is 1, 2 or 3`,trick:`<ul><li>A corner exactly <b>on</b> the plane counts as removed. A mesh face lying on the plane then gives one cap face, not two identical ones that would flicker.</li>
<li>The tetrahedra are pre-sorted in layers along the plane direction, so a plane dragged along its normal only reads its own layer.</li></ul>`,legend:`${th} tetrahedra crossed by the plane`,scene:{model:"block",elements:[We([0,0,0],[.3,1,.2])],ghost:!0,cutTets:!0,normals:!0,camera:[2.3,2.3,2.5],anim:(n,t)=>t.update(0,{center:[0,.55*Math.sin(n*.6),0]})}},{title:"Cut one tetrahedron",where:"Background thread",body:`<p>Zoom on one crossed tetrahedron. On each of its 6 edges whose two ends have opposite signs, the plane

a simple linear interpolation.</p>
<p>One corner alone on its side gives <b>3 points</b> (a triangle). Two and two gives <b>4 points</b> (a quadrilateral), as here.</p>`,math:`t = dA / (dA \u2212 dB)
point = pA + t \xB7 (pB \u2212 pA)`,legend:`${Qo} corner kept &nbsp; ${tl} corner removed &nbsp; <i class="sw" style="background:#ff8141"></i> crossed edge &nbsp; ${th} crossing point`,scene:{model:"block",elements:[We([.05,.02,.03],[.35,1,.25])],focus:"distances",camera:[2.3,1.6,2.6]}},{title:"Order the points and split into triangles",where:"Background thread",body:`<p>The points come out in edge order, which is not a polygon. They are sorted by <b>angle</b> around
their center, measured in two directions lying in the plane.</p>
<p>The cut of a tetrahedron is always <b>convex</b>, so it is then split into triangles from its first point (a <b>fan</b>).</p>`,math:`c = average of the points
a, b = two directions in the plane

<p>When the result changes (here, playing frames), the cap is <b>not rebuilt</b>: the same weights are
applied to the new values.</p>`,math:`value = w\u2080\xB7f\u2080 + w\u2081\xB7f\u2081 + w\u2082\xB7f\u2082 + w\u2083\xB7f\u2083

and add the crossing point on each side of the polygon that changes side.</p>
<p>A tetrahedron fully behind another plane is skipped before any polygon is made.</p>`,math:"for each other plane:  keep corners with d \u2265 0,  add the point at t = d\u2081 / (d\u2081 \u2212 d\u2082) on each changing side",legend:"one colour per plane cap",scene:{model:"block",elements:[We([.05,.05,0],[.1,1,.05]),We([-.1,0,0],[1,.1,-.15])],surface:"clipped",cap:"section",capWire:!0,normals:!0,camera:[2.4,2.2,2.6]}},{title:"A box is six planes",where:"Background thread",body:`<p>For the cap, a box is cut into <b>six flat cuts</b>, one per face. Each face cap keeps only the part

A = [ p\u2081 \u2212 p\u2080,  p\u2082 \u2212 p\u2080,  p\u2083 \u2212 p\u2080 ]`,legend:"one colour per tetrahedron",scene:{model:"block",elements:[Rs([.55,.3,.3],1.1)],surface:"clipped",cap:"tet",camera:[2.6,2,2.4]}},{title:"Caps and the other volumes",where:"GPU and background thread",body:`<p>A box cap lies exactly <b>on</b> its own box, and step 5 removes the box boundary too. Cut by every

<li>Two identical volumes share one owner, so their caps do not erase each other.</li></ul>`,trick:"One extra vertex attribute (<code>owner</code>) on the cap, and one <code>continue</code> in the shader loop of step 5.",legend:'<i class="sw" style="background:#fe5b04"></i> cap owned by the box &nbsp; <i class="sw" style="background:#3b82f6"></i> cap owned by the sphere',scene:{model:"block",elements:[Cs([.35,.3,.3],[.9,.9,.9]),Rs([-.25,.35,.35],1)],surface:"clipped",cap:"owner",camera:[2.5,2.2,2.5]}},{title:"Draw the red outline",where:"Main thread",body:`<p>The red line shows where each shape meets the surface. It is computed triangle by triangle on the surface:</p>

<li><b>Box</b>: the line of each face on the triangle, trimmed to the box (<b>Liang\u2013Barsky</b>).</li>
